name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Tauri's Linux build needs the system webkit/gtk libraries. The keyring
      # Secret Service backend talks D-Bus over pure-Rust zbus, so no libdbus
      # dev package is required to compile.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - run: npm ci

      - name: Typecheck frontend
        run: npx tsc -b --pretty false

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build (portable, no bundle)
        run: npm run tauri build -- --no-bundle

  # Dependency advisory scan. Separate job (Linux only) so it does not triple
  # the matrix cost; reads src-tauri/audit.toml for tracked/ignored advisories.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
